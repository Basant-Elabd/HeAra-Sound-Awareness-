name: Heara
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ================= FIREBASE =================
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.0

  # ================= AUDIO / AI =================
  record: ^5.1.2
  http: ^1.2.2
  onnxruntime: ^1.4.1

  # ================= OFFLINE AI (Emergency Mode) =================
  tflite_flutter: ^0.12.1

  # ================= NOTIFICATIONS =================
  flutter_local_notifications: ^17.2.2
  vibration: ^2.0.0

  # ================= FILES =================
  path_provider: ^2.1.4

  # ================= UI =================
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.2.1

  # ================= BACKGROUND SERVICE =================
  flutter_foreground_task: ^8.13.1

  # ================= BLE (NEW - ESP32) =================
  flutter_blue_plus: ^1.34.5
  permission_handler: ^11.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  record_linux: ^1.3.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"